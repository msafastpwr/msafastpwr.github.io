<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}Microsoft Student Ambassadors &bull; FAST Peshawar</title>
<meta name="description" content="{{ page.description | default: 'Official portal of Microsoft Student Ambassadors at FAST NUCES Peshawar. Fostering technical leadership in Cloud, AI, and DevOps.' }}">
<meta name="theme-color" content="#0078D4">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://msafastpwr.github.io{{ page.url }}">
<meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}Microsoft Student Ambassadors &bull; FAST Peshawar">
<meta property="og:description" content="{{ page.description | default: 'Empowering students at FAST NUCES Peshawar with Microsoft technologies, cloud computing, and developer leadership.' }}">
<meta property="og:image" content="https://msafastpwr.github.io/images/shared/og-card.webp">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}Microsoft Student Ambassadors &bull; FAST Peshawar">
<meta name="twitter:description" content="{{ page.description | default: 'Empowering students at FAST NUCES Peshawar with Microsoft technologies, cloud computing, and developer leadership.' }}">
<meta name="twitter:image" content="https://msafastpwr.github.io/images/shared/og-card.webp">

<!-- Favicon -->
<link rel="icon" type="image/png" href="/images/shared/favicon.png">
<link rel="apple-touch-icon" href="/images/shared/favicon.png">

<!-- Core Theme Stylesheet -->
<link rel="stylesheet" href="/assets/css/theme.css">

<!-- Page Specific Stylesheet if declared -->
{% if page.css %}
<link rel="stylesheet" href="{{ page.css }}">
{% endif %}

<!-- Zero-FOUC Theme Persistence Script -->
<script>
  (function () {
    try {
      var storedTheme = localStorage.getItem('msa-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var activeTheme = storedTheme ? storedTheme : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', activeTheme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
